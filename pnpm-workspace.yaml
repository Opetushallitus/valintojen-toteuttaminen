packages:
  - .
allowBuilds:
  esbuild: true
# Estetään valinnaisten peer-riippuvuuksien (mm. next) automaattinen asennus
autoInstallPeers: false
# Ei tarkisteta/asenneta riippuvuuksia automaattisesti "pnpm run"-komennoissa.
# Frontend-maven-pluginin kautta ajettuna automaattinen asennus kaatuu (EACCES),
# koska pnpm-binääri on symlink pnpm.cjs-tiedostoon.
verifyDepsBeforeRun: false
peerDependencyRules:
  ignoreMissing:
    - next
minimumReleaseAge: 4320
overrides:
  'lodash-es': '4.18.1'

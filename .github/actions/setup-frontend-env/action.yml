name: setup-frontend-env
description: 'Setup frontend environment'
inputs:
  install:
    description: 'Whether to run `pnpm install`'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.tool-versions'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@opetushallitus'
    - name: Read pnpm version from .tool-versions
      id: pnpm-version
      shell: bash
      run: echo "version=$(awk '$1 == "pnpm" { print $2; exit }' .tool-versions)" >> "$GITHUB_OUTPUT"
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        version: ${{ steps.pnpm-version.outputs.version }}
        install: ${{ inputs.install }}
        cache: true

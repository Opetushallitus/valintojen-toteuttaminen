name: Valintojen toteuttaminen workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  HUSKY: 0
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend-env
      - name: Check types
        run: pnpm run typecheck
      - name: Run linter
        run: pnpm run lint
      - name: Run unit tests
        run: pnpm run test
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # Lopetetaan, jos testit epäonnistuu yhdellä selaimella
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend-env
      - name: Create self-signed dev certificates
        run: pnpm run create-self-signed-dev-certs
      - name: Build app
        run: pnpm run build-test
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_ARGS: --project=${{ matrix.browser }}
        run: pnpm run start-and-test-playwright-docker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 10
          if-no-files-found: ignore
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      # frontend-maven-plugin ajaa pnpm installin, joka tarvitsee
      # autentikoinnin npm.pkg.github.com-rekisteriin (@opetushallitus-paketit)
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@opetushallitus'
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: 'Europe/Helsinki'
      - name: Build with Maven
        working-directory: ./server
        run: mvn clean spotless:check package -B
      - uses: actions/cache@v5
        with:
          path: server/target
          key: ${{ github.sha }}
  deploy-container:
    needs: [lint-and-test, e2e, build]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: server/target
          key: ${{ github.sha }}
      - name: Build and upload Docker container
        shell: bash
        run: |
          git clone https://github.com/Opetushallitus/ci-tools.git
          source ci-tools/common/setup-tools.sh
          export ARTIFACT_NAME="valintojen-toteuttaminen"
          mv server/target/valintojen-toteuttaminen-*.jar $DOCKER_BUILD_DIR/artifact/${ARTIFACT_NAME}.jar
          cp -vr server/src/main/resources/* $DOCKER_BUILD_DIR/config/
          export BASE_IMAGE="baseimage-fatjar-openjdk21:master"
          ./ci-tools/common/pull-image.sh
          ./ci-tools/github-build/build-fatjar.sh $ARTIFACT_NAME
          ./ci-tools/github-build/upload-image.sh $ARTIFACT_NAME

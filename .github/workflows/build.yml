name: Valintojen toteuttaminen workflow
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

env:
  HUSKY: 0
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend-env
      - name: Check types
        run: pnpm run typecheck
      - name: Run linter
        run: pnpm run lint
      - name: Run unit tests
        run: pnpm run test
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # Lopetetaan, jos testit epäonnistuu yhdellä selaimella
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-frontend-env
      - name: Create self-signed dev certificates
        run: pnpm run create-self-signed-dev-certs
      # e2e ajetaan react-router dev -serveriä vasten (start-test), ei erillistä buildia
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_ARGS: --project=${{ matrix.browser }}
        run: pnpm run start-and-test-playwright-docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 10
          if-no-files-found: ignore
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .tool-versions
          cache: 'maven'
      - uses: ./.github/actions/setup-frontend-env
        with:
          install: false
      - name: Build with Maven
        working-directory: ./server
        run: mvn clean spotless:check package -B
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/target
          key: ${{ github.sha }}
  deploy-container:
    needs: [lint-and-test, e2e, build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/target
          key: ${{ github.sha }}
      - name: Build and upload Docker container
        shell: bash
        run: |
          git clone https://github.com/Opetushallitus/ci-tools.git
          source ci-tools/common/setup-tools.sh
          export ARTIFACT_NAME="valintojen-toteuttaminen"
          mv server/target/valintojen-toteuttaminen-*.jar $DOCKER_BUILD_DIR/artifact/${ARTIFACT_NAME}.jar
          cp -vr server/src/main/resources/* $DOCKER_BUILD_DIR/config/
          export BASE_IMAGE="baseimage-fatjar-openjdk21:master"
          ./ci-tools/common/pull-image.sh
          ./ci-tools/github-build/build-fatjar.sh $ARTIFACT_NAME
          ./ci-tools/github-build/upload-image.sh $ARTIFACT_NAME
